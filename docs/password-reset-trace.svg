<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="354" viewBox="0 0 1080 354" role="img" aria-labelledby="title desc">
  <title id="title">Agent Quality Desk: password reset case FB-H4-035</title>
  <desc id="desc">The bot claimed a reset link lasted two hours. Policy password-v2 specifies 30 minutes. QA confirmed the error, and the locked verifier passed a corrected claim entered by hand.</desc>
  <rect x="1" y="1" width="1078" height="352" rx="22" fill="#f3f6fa" stroke="#c8d3e1"/>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#17283b">
    <text x="32" y="42" font-size="15" font-weight="700" fill="#445e78">AGENT QUALITY DESK · CASE FB-H4-035</text>
    <text x="32" y="87" font-size="32" font-weight="700">How QA caught a wrong password reset answer</text>
    <g fill="#fff" stroke="#c8d3e1">
      <rect x="32" y="115" width="328" height="179" rx="14"/>
      <rect x="376" y="115" width="328" height="179" rx="14"/>
      <rect x="720" y="115" width="328" height="179" rx="14"/>
    </g>
    <g font-size="16" font-weight="700" fill="#405973">
      <text x="54" y="149">1. BOT REPLY</text>
      <text x="398" y="149">2. POLICY EVIDENCE</text>
      <text x="742" y="149">3. QA AND RECHECK</text>
    </g>
    <g font-size="23" font-weight="650">
      <text x="54" y="191">“The link stays valid</text>
      <text x="54" y="220">for two hours.”</text>
      <text x="398" y="191">Reset links expire</text>
      <text x="398" y="220">after 30 minutes.</text>
      <text x="742" y="191">QA confirmed the error.</text>
      <text x="742" y="220">The correction passed.</text>
    </g>
    <g font-size="17" font-weight="650">
      <text x="54" y="266" fill="#a32829">Blind check: Fail</text>
      <text x="398" y="266" fill="#315b87">Source: password-v2</text>
      <text x="742" y="266" fill="#13734c">Verifier recheck: Pass</text>
    </g>
    <text x="32" y="329" font-size="16" fill="#405973">Recorded from Run 5. The corrected claim was entered manually for the verifier recheck.</text>
  </g>
</svg>
